name: Auto Update Profile

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [update-profile]

jobs:
  update-profile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      working-directory: ./scripts
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create directories
      run: |
        mkdir -p assets output
    
    - name: Run profile update script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USERNAME: PoornaSri26
      working-directory: ./scripts
      run: python update_profile.py
    
    - name: Generate personalized banner
      env:
        GITHUB_USERNAME: PoornaSri26
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: ./scripts
      run: python generate_banner.py
    
    - name: Check for errors
      working-directory: ./scripts
      run: python error_check.py
    
    - name: Verify banner generation
      run: |
        if [ -f "assets/banner.svg" ]; then
          echo "Animated SVG banner generated successfully"
        else
          echo "Banner generation failed, but continuing with header/footer animations"
        fi
    
    - name: Commit changes
      run: |
        git config --local user.email "poornasri.n24@gmail.com"
        git config --local user.name "Poorna Sri"
        git add README.md
        if [ -f "assets/banner.svg" ]; then
          git add assets/banner.svg
        fi
        git diff --staged --quiet || git commit -m "Auto-update profile: $(date '+%Y-%m-%d %H:%M:%S')"
    
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main