name: Commit Pet 🐱
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  pet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: The-Commit-Company/commit-pet@v1
        with:
          species: 'cat'
          name: 'Byte'
          output: 'commit-pet.svg'
          github_token: ${{ secrets.GITHUB_TOKEN }}
