<?xml version="1.0" encoding="UTF-8"?>

<svg
    width="1280"
    height="430"
    viewBox="0 0 1280 430"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>

    <linearGradient
        id="backgroundGradient"
        x1="0"
        y1="0"
        x2="1280"
        y2="430"
        gradientUnits="userSpaceOnUse"
    >
        <stop offset="0" stop-color="#070A0F"/>
        <stop offset="0.5" stop-color="#0B1018"/>
        <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>

    <linearGradient
        id="accentGradient"
        x1="0"
        y1="0"
        x2="600"
        y2="0"
        gradientUnits="userSpaceOnUse"
    >
        <stop offset="0" stop-color="#00E5FF"/>
        <stop offset="0.35" stop-color="#4D7CFE"/>
        <stop offset="0.65" stop-color="#8B5CF6"/>
        <stop offset="1" stop-color="#FF69B4"/>
    </linearGradient>

    <linearGradient
        id="terminalGradient"
        x1="80"
        y1="270"
        x2="760"
        y2="270"
        gradientUnits="userSpaceOnUse"
    >
        <stop offset="0" stop-color="#00E5FF" stop-opacity="0.08"/>
        <stop offset="0.5" stop-color="#FF69B4" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.03"/>
    </linearGradient>

    <pattern
        id="grid"
        width="42"
        height="42"
        patternUnits="userSpaceOnUse"
    >
        <path
            d="M42 0H0V42"
            stroke="#F5F7FA"
            stroke-opacity="0.035"
            stroke-width="1"
        />
    </pattern>

    <pattern
        id="microGrid"
        width="10"
        height="10"
        patternUnits="userSpaceOnUse"
    >
        <path
            d="M10 0H0V10"
            stroke="#F5F7FA"
            stroke-opacity="0.012"
            stroke-width="1"
        />
    </pattern>

    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="7" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowPink" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient
        id="cyanAura"
        cx="0"
        cy="0"
        r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(1050 210) rotate(90) scale(190)"
    >
        <stop offset="0" stop-color="#00E5FF" stop-opacity="0.12"/>
        <stop offset="0.35" stop-color="#FF69B4" stop-opacity="0.08"/>
        <stop offset="0.65" stop-color="#4D7CFE" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="avatarClip">
        <circle cx="1010" cy="48" r="16"/>
    </clipPath>

</defs>

<rect width="1280" height="430" fill="url(#backgroundGradient)"/>
<rect width="1280" height="430" fill="url(#microGrid)"/>
<rect width="1280" height="430" fill="url(#grid)"/>

